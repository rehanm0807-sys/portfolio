<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You</title>

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(120deg, #1e1b4b, #312e81);
    min-height: 100vh;
    color: white;
}

/* NAVBAR */
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    background: #000;
}

.left-nav{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-icon{
    font-size:26px;
    cursor:pointer;
}

.logo{
    font-size: 26px;
    font-weight: bold;
}

.menu{
    list-style: none;
    display: flex;
    gap: 25px;
}

.menu a{
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
}

.menu a:hover{
    color: #22c55e;
}

/* SIDEBAR */
.side-menu{
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: #111;
    padding-top: 60px;
    transition: 0.3s;
    z-index: 1000;
}

.side-menu a{
    display:block;
    padding:15px 25px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #333;
}

.side-menu a:hover{
    background:#222;
}

/* OVERLAY */
.overlay{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.4);
    display:none;
    z-index:999;
}

/* THANK YOU SECTION */
.thankyou{
    min-height: calc(100vh - 70px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.thankyou h1{
    font-size: 70px;
    margin-bottom: 15px;
    animation: glow 2.5s infinite alternate, fadeUp 1.5s ease;
}

.thankyou p{
    font-size: 26px;
    margin-bottom: 40px;
    opacity: 0.95;
    animation: fadeUp 2.2s ease;
}

button{
    padding: 14px 34px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg,#22c55e,#4ade80);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: transform 0.3s, box-shadow 0.3s;
}

button:hover{
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255,255,255,0.5);
}

/* ANIMATIONS */
@keyframes fadeUp{
    from{
        opacity: 0;
        transform: translateY(30px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glow{
    from{
        text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
    to{
        text-shadow: 0 0 35px rgba(255,255,255,0.9);
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="left-nav">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="logo">Analysispro</div>
    </div>

    <ul class="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/login">Login</a></li>
    </ul>
</nav>

<!-- SIDEBAR -->
<div id="sideMenu" class="side-menu">
    <a href="/stocks">Stocks</a>
    <a href="/risk">Risk</a>
    <a href="/livechart">Live Chart</a>
    <a href="/prediction">Prediction Chart</a>
    <a href="/technical">Technical Analysis</a>
    <a href="/market">Market</a>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- THANK YOU CONTENT -->
<section class="thankyou">
    <h1>Thank You</h1>
    <p>Thank you for using Analysispro</p>
    <a href="/"><button>Go Home</button></a>
</section>

<script>

/* SIDEBAR LOGIC */
let menu = document.getElementById("sideMenu");
let overlay = document.getElementById("overlay");

function toggleMenu(){
    if(menu.style.left === "0px"){
        closeMenu();
    }else{
        menu.style.left = "0";
        overlay.style.display = "block";
    }
}

function closeMenu(){
    menu.style.left = "-250px";
    overlay.style.display = "none";
}

</script>

</body>
</html>
