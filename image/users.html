<!DOCTYPE html>
<html>
<head>
<title>Users</title>

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(120deg, #1e1b4b, #312e81);
    color:white;
}

.container{
    padding:40px;
}

table{
    width:100%;
    border-collapse:collapse;
    background: #e0e7ff;
    color:black;
    border-radius:10px;
    overflow:hidden;
}

th, td{
    padding:12px;
    text-align:center;
}

th{
    background:#4f46e5;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
}

a{
    display:inline-block;
    margin-top:20px;
    color:white;
}
</style>
</head>

<body>

<div class="container">
    <h2>All Users </h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Password</th>
            <th>Role</th>
        </tr>

        {% for user in users %}
<tr>
    <td>{{ loop.index }}</td>  <!-- 1,2,3... -->
    <td>{{ user[1] }}</td>
    <td>{{ user[2] }}</td>
    <td>{{ user[3] }}</td>
    <td>{{ user[4] }}</td>
</tr>
{% endfor %}
    </table>

    <a href="/admin">⬅ Back</a>
</div>

</body>
</html>
