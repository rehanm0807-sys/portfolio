<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Stock Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
/* (TERA SAME CSS — NO CHANGE) */
.tv-left-toolbar,.tv-float-toolbar,.tv-side-toolbar{display:none!important;}
.tv-price-axis,.price-axis,.tv-axis-widget{display:none!important;}

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg, #1e1b4b, #312e81);
    color:white;
    text-align:center;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 30px;
    background:#111;
}

.left-nav{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-icon{font-size:26px;cursor:pointer;}
.logo{font-size:22px;font-weight:bold;}

.menu{list-style:none;display:flex;gap:20px;}
.menu a{color:white;text-decoration:none;font-size:15px;}

.side-menu{
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: #111;
    padding-top: 60px;
    transition: 0.3s;
    z-index: 1000;
}

.side-menu a{
    display:block;
    padding:15px 25px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #333;
}

.side-menu a:hover{background:#222;}

.overlay{
    position: fixed;
    top:0;left:0;width:100%;height:100%;
    background: rgba(0,0,0,0.4);
    display:none;z-index:999;
}

.container{
    max-width:900px;
    margin:40px auto;
    background: #e0e7ff;
    color:black;
    padding:20px;
    border-radius:12px;
}

iframe{
    width:100%;
    height:450px;
    border:none;
    border-radius:10px;
}

button{
    padding:10px 22px;
    margin:15px 10px;
    border:none;
    border-radius:20px;
    background:#2d1457;
    color:white;
    cursor:pointer;
}
button:hover{background:#3c1c74;}
</style>
</head>

<body>

<nav class="navbar">
    <div class="left-nav">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="logo">Analysispro</div>
    </div>

    <ul class="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/stocks">Stocks</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>
</nav>

<div id="sideMenu" class="side-menu">
    <a href="/stocks">Stocks</a>
    <a href="/risk">Risk</a>
    <a href="/livechart">Live Chart</a>
    <a href="/prediction">Prediction Chart</a>
    <a href="/technical">Technical Analysis</a>
    <a href="/market">Market</a>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div class="container">
    <h2>📈 Live Stock Chart</h2>
    <h3 id="stockName"></h3>

    <iframe id="chartFrame"></iframe>

    <div>
        <button onclick="goBack()">⬅Stocks</button>
        <button onclick="goNext()">Risk➡</button>
    </div>
</div>

<script>

let stock = localStorage.getItem("stock") || "TCS";
document.getElementById("stockName").innerText = stock;

/* CHART */
document.getElementById("chartFrame").src =
  "https://s.tradingview.com/widgetembed/?" +
  "symbol=" + stock +
  "&interval=D&theme=light&style=1" +
  "&hide_top_toolbar=true&hide_side_toolbar=true" +
  "&hide_legend=true&hide_volume=true" +
  "&allow_symbol_change=false";

/* 🔥 TREND LOGIC (SIMULATION) */
let lastPrice = localStorage.getItem("lastPrice") || Math.random()*1000;
let currentPrice = Math.random()*1000;

let trend = "same";

if(currentPrice > lastPrice){
    trend = "up";
}else if(currentPrice < lastPrice){
    trend = "down";
}

localStorage.setItem("trend", trend);
localStorage.setItem("lastPrice", currentPrice);

/* MENU */
let menu = document.getElementById("sideMenu");
let overlay = document.getElementById("overlay");

function toggleMenu(){
    if(menu.style.left === "0px"){
        closeMenu();
    }else{
        menu.style.left = "0";
        overlay.style.display = "block";
    }
}

function closeMenu(){
    menu.style.left = "-250px";
    overlay.style.display = "none";
}

/* NAV */
function goBack(){ window.location.href = "/stocks"; }
function goNext(){ window.location.href = "/risk"; }

</script>

</body>
</html>
