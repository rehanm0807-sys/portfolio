<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Risk Meter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg, #1e1b4b, #312e81);
    min-height: 100vh;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#111;
    color:white;
}

.left-nav{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-icon{
    font-size:26px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.menu{
    list-style:none;
    display:flex;
    gap:25px;
}

.menu a{
    color:white;
    text-decoration:none;
}

/* SIDEBAR */
.side-menu{
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: #111;
    padding-top: 60px;
    transition: 0.3s;
    z-index: 1000;
}

.side-menu a{
    display:block;
    padding:15px 25px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #333;
}

.side-menu a:hover{
    background:#222;
}

/* OVERLAY */
.overlay{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.4);
    display:none;
    z-index:999;
}

/* CARD */
.main-card{
    margin:60px auto;
    width:420px;
    background: #e0e7ff;
    padding:25px;
    border-radius:8px;
    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.risk{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

/* CHART */
canvas{
    width:320px !important;
    height:320px !important;
    display:block;
    margin:20px auto;
}

/* METER */
.meter{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:100%;
}

/* BUTTONS */
.btn-box{
    width:100%;
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

button{
    padding:10px 20px;
    background:#3f5bd8;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.back-btn{
    background:#6b7280;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="left-nav">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="logo">Analysispro</div>
    </div>

    <ul class="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/login">Login</a></li>
    </ul>
</nav>

<!-- SIDEBAR -->
<div id="sideMenu" class="side-menu">
    <a href="/stocks">Stocks</a>
    <a href="/risk">Risk</a>
    <a href="/livechart">Live Chart</a>
    <a href="/prediction">Prediction Chart</a>
    <a href="/technical">Technical Analysis</a>
    <a href="/market">Market</a>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- MAIN -->
<div class="main-card">
    <div class="risk" id="title"></div>

    <canvas id="riskChart"></canvas>

    <div class="meter">
        <div class="fill"></div>
    </div>

    <div class="btn-box">
        <button class="back-btn" onclick="goBack()">⬅ Live stock</button>
        <button onclick="goToTechnical()">Analysis ➡</button>
    </div>
</div>

<script>

/* MENU */
let menu = document.getElementById("sideMenu");
let overlay = document.getElementById("overlay");

function toggleMenu(){
    if(menu.style.left === "0px"){
        closeMenu();
    }else{
        menu.style.left = "0";
        overlay.style.display = "block";
    }
}

function closeMenu(){
    menu.style.left = "-250px";
    overlay.style.display = "none";
}

/* 🔥 STOCK + TREND */
let stock = localStorage.getItem("stock") || "TCS";
let trend = localStorage.getItem("trend") || "same";

/* 🔥 RISK CALCULATION */
let riskValue;

if(trend === "down"){
    // HIGH RISK (60 - 90)
    riskValue = Math.floor(Math.random() * 30) + 60;

}else if(trend === "up"){
    // LOW RISK (10 - 30)
    riskValue = Math.floor(Math.random() * 20) + 10;

}else{
    // MEDIUM RISK (35 - 55)
    riskValue = Math.floor(Math.random() * 20) + 35;
}

let safeValue = 100 - riskValue;

/* TITLE */
document.getElementById("title").innerText =
    stock + " Risk-O-Meter";

/* BAR */
let fill = document.querySelector(".fill");
fill.style.width = riskValue + "%";

if(riskValue <= 25){
    fill.style.background = "#22c55e";
}else if(riskValue <= 50){
    fill.style.background = "#facc15";
}else{
    fill.style.background = "#ef4444";
}

/* CHART */
new Chart(document.getElementById("riskChart"), {
    type: 'pie',
    data: {
        labels: ["Risk", "Safe"],
        datasets: [{
            data: [riskValue, safeValue],
            backgroundColor: ["#ef4444", "#22c55e"]
        }]
    },
    options: {
        responsive: false
    }
});

/* NAVIGATION */
function goBack(){
    window.location.href = "/livechart";
}

function goToTechnical(){
    window.location.href = "/technical";
}

</script>

</body>
</html>
