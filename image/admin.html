<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(120deg, #1e1b4b, #312e81);
            min-height: 100vh;
            color: white;
        }

        /* NAVBAR */
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: #111;
        }

        .logo{
            font-size: 24px;
            font-weight: bold;
        }

        .menu{
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .menu a{
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        /* CONTACT SECTION */
        .contact{
            max-width: 900px;
            margin: 60px auto;
            background: rgba(0,0,0,0.35);
            padding: 40px;
            border-radius: 15px;
            animation: fadeUp 1.2s ease;
        }

        .contact h1{
            font-size: 42px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .contact p{
            font-size: 18px;
            line-height: 1.7;
            text-align: center;
            margin-bottom: 30px;
        }

        .info{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card{
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .card:hover{
            transform: translateY(-8px);
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
        }

        .card h3{
            font-size: 36px;
            margin-bottom: 10px;
        }

        .card p{
            font-size: 28px;
            margin: 5px 0;
        }

        .btn{
            display: inline-block;
            margin-top: 35px;
            padding: 12px 30px;
            background: #22c55e;
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .btn:hover{
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        @keyframes fadeUp{
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg, #020617, #0f172a);
    color:white;
}

/* NAVBAR */
.navbar{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    background:#111;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

/* DASHBOARD */
.container{
    padding:40px;
}

h1{
    margin-bottom:30px;
}

/* CARDS */
.cards{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:220px;
    background: #e0e7ff;
    color:#000;
    padding:25px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    margin-bottom:10px;
    color:#4f46e5;
}

.card a{
    text-decoration:none;
    color:#111;
    font-weight:bold;
}

       
    
/* BUTTON */
.logout{
    margin-top:30px;
    display:inline-block;
    padding:12px 20px;
    border-radius:25px;
    background:#ef4444;
    color:white;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">Analysispro Admin</div>
  <ul class="menu">
  <li><a href="/">Home</a></li>
    <li><a href="/about">About</a></li>
    
    <li><a href="/login">Login</a></li>
</div>

<div class="container">
    <h1>Welcome Admin </h1>

    <div class="cards">

        <div class="card">
            <h3> Your all Users</h3>
            <p>View your all users</p>
            <a href="/admin/users">Go →</a>
        </div>

      

      

    </div>

    <a class="logout" href="/logout">Logout</a>
</div>

</body>
</html>
