<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analysispro | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background: linear-gradient(120deg, #1e1b4b, #312e81);/* ✅ lighter gradient */
    color:white;
}

/* NAVBAR */
.navbar{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    background:#111;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.menu{
    list-style:none;
    display:flex;
    gap:25px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

/* PAGE CENTER */
.page{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN CARD */
.login-card{
    width:360px;
    background: #e0e7ff;
    color:#000;
    border-radius:18px;
    padding:35px 30px;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
    animation: slideUp 0.8s ease;
}

.login-card h2{
    color:#1e3a8a;
    margin-bottom:6px;
}

.login-card p{
    font-size:14px;
    color:#555;
    margin-bottom:25px;
}

.login-card input{
    width:100%;
    padding:13px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}

.login-card input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 2px rgba(79,70,229,0.15);
}

/* PASSWORD */
.password-box{
    position:relative;
}

.password-box button{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    font-size:18px;
}

/* BUTTON */
.login-card button[type="submit"]{
    width:100%;
    padding:13px;
    border-radius:30px;
    border:none;
    background: linear-gradient(90deg,#3f5bd8,#6366f1);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-card button[type="submit"]:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(79,70,229,0.4);
}

/* ERROR */
.error{
    margin-top:15px;
    color:#dc2626;
    font-size:14px;
}

@keyframes slideUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">Analysispro</div>
    <ul class="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/signup">Signup</a></li>
    </ul>
</nav>

<div class="page">
    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Login to your Analysispro account</p>

        <form method="POST" action="/login">
            
            <!-- ✅ EMAIL FIELD -->
            <input type="email" name="username" placeholder="Enter Email" required>

            <div class="password-box">
                <input type="password" name="password" id="password" placeholder="Password" required>
                <button type="button" onclick="togglePassword()">👁️</button>
            </div>

            <button type="submit">Login</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</div>

<script>
function togglePassword(){
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
