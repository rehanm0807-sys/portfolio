<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Technical Indicator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg, #1e1b4b, #312e81);
    min-height: 100vh;
    color: white;
    text-align: center;
}

/* NAVBAR */
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    background: #111;
}

.left-nav{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-icon{
    font-size:26px;
    cursor:pointer;
}

.logo{
    font-size: 24px;
    font-weight: bold;
}

.menu{
    list-style: none;
    display: flex;
    gap: 25px;
}

.menu a{
    color: white;
    text-decoration: none;
    font-size: 16px;
}

/* SIDEBAR */
.side-menu{
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: #111;
    padding-top: 60px;
    transition: 0.3s;
    z-index: 1000;
}

.side-menu a{
    display:block;
    padding:15px 25px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #333;
}

.side-menu a:hover{
    background:#222;
}

/* OVERLAY */
.overlay{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.4);
    display:none;
    z-index:999;
}

/* TITLE */
h2{
    margin-top: 25px;
}

/* CHART */
canvas{
    width: 500px !important;
    height: 500px !important;
    margin: 30px auto;
    display: block;
    background: #e0e7ff;
    border-radius: 12px;
    padding: 15px;
}

/* BUTTONS */
button{
    padding: 10px 22px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    background: #2d1457;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:hover{
    background: #3c1c74;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="left-nav">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="logo">Analysispro</div>
    </div>

    <ul class="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/login">Login</a></li>
    </ul>
</nav>

<!-- SIDEBAR -->
<div id="sideMenu" class="side-menu">
    <a href="/stocks">Stocks</a>
    <a href="/risk">Risk</a>
    <a href="/livechart">Live Chart</a>
    <a href="/prediction">Prediction Chart</a>
    <a href="/technical">Technical Analysis</a>
    <a href="/market">Market</a>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<h2 id="title">Technical Indicator</h2>

<canvas id="tech"></canvas>

<div style="margin-bottom:30px;">
    <button onclick="goBack()">⬅Risk</button>
    <button onclick="goNext()">Prediction➡</button>
</div>

<script>

/* SIDEBAR LOGIC */
let menu = document.getElementById("sideMenu");
let overlay = document.getElementById("overlay");

function toggleMenu(){
    if(menu.style.left === "0px"){
        closeMenu();
    }else{
        menu.style.left = "0";
        overlay.style.display = "block";
    }
}

function closeMenu(){
    menu.style.left = "-250px";
    overlay.style.display = "none";
}

/* TECHNICAL DATA */
const technicalData = {
    "TCS": 75,
    "INFY": 70,
    "RELIANCE": 65,
    "HDFCBANK": 72,
    "ICICIBANK": 68,
    "SBIN": 55,
    "ITC": 78,
    "HINDUNILVR": 74,
    "BAJFINANCE": 50,
    "AXISBANK": 60,
    "KOTAKBANK": 71,
    "LT": 66,
    "MARUTI": 69,
    "TATAMOTORS": 58,
    "SUNPHARMA": 73,
    "WIPRO": 62,
    "ADANIENT": 45,
    "ADANIPORTS": 52,
    "ONGC": 63,
    "POWERGRID": 76,
    "NTPC": 77,
    "ASIANPAINT": 74,
    "ULTRACEMCO": 64,
    "JSWSTEEL": 57,
    "HCLTECH": 70
};

/* GET STOCK */
let stock = localStorage.getItem("stock") || "TCS";
let techValue = technicalData[stock] ?? 60;

/* TITLE */
document.getElementById("title").innerText =
    stock + " Technical Analysis";

/* COLOR */
let techColor = "#22c55e";
if(techValue < 50) techColor = "#ef4444";
else if(techValue < 65) techColor = "#facc15";

/* 🔥 NEEDLE + SCALE */
const gaugeNeedle = {
    id:'needle',
    afterDraw(chart){
        const {ctx} = chart;
        const meta = chart.getDatasetMeta(0);
        const x = meta.data[0].x;
        const y = meta.data[0].y;

        /* NEEDLE */
        const angle = Math.PI + (techValue/100)*Math.PI;

        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.moveTo(0,-5);
        ctx.lineTo(140,0);
        ctx.lineTo(0,5);
        ctx.fillStyle="red";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0,0,6,0,Math.PI*2);
        ctx.fillStyle="#000";
        ctx.fill();
        ctx.restore();

        /* SCALE */
        ctx.save();
        ctx.font="12px Arial";
        ctx.fillStyle="#000";
        ctx.textAlign="center";

        for(let i=0;i<=100;i+=10){
            let ang = Math.PI + (i/100)*Math.PI;
            let tx = x + Math.cos(ang)*180;
            let ty = y + Math.sin(ang)*180;
            ctx.fillText(i, tx, ty);
        }

        ctx.restore();
    }
};

/* GAUGE CHART */
new Chart(document.getElementById("tech"),{
    type:'doughnut',
    data:{
        datasets:[{
            data:[techValue, 100 - techValue],
            backgroundColor:[techColor, "#e5e7eb"],
            borderWidth:0,
            cutout:"75%"
        }]
    },
    options:{
        rotation:-90,
        circumference:180,
        responsive:false,
        plugins:{
            legend:{ display:false },
            tooltip:{ enabled:false }
        }
    },
    plugins:[
        {
            id:'gaugeText',
            beforeDraw(chart){
                const {width, height} = chart;
                const ctx = chart.ctx;

                ctx.restore();
                ctx.font = "bold 40px Arial";
                ctx.fillStyle = "#000";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.fillText(techValue + "%", width/2, height - 80);
                ctx.save();
            }
        },
        gaugeNeedle
    ]
});

/* NAVIGATION */
function goBack(){
    window.location.href = "/risk";
}

function goNext(){
    window.location.href = "/prediction";
}

</script>

</body>
</html>
