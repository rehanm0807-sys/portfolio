<!DOCTYPE html>
<html>
<head>
<title>Prediction Chart</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.logo{
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse{
    0%{ transform: scale(1); opacity: 1; }
    50%{ transform: scale(1.1); opacity: 0.7; }
    100%{ transform: scale(1); opacity: 1; }
}
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg, #1e1b4b, #312e81);
    min-height: 100vh;
    color: white;
    text-align: center;
}

/* NAVBAR */
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    background: #111;
}

.left-nav{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-icon{
    font-size:26px;
    cursor:pointer;
}

.logo{
    font-size: 24px;
    font-weight: bold;
}

.menu{
    list-style: none;
    display: flex;
    gap: 25px;
}

.menu a{
    color: white;
    text-decoration: none;
    font-size: 16px;
}

/* SIDEBAR */
.side-menu{
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: #111;
    padding-top: 60px;
    transition: 0.3s;
    z-index: 1000;
}

.side-menu a{
    display:block;
    padding:15px 25px;
    color:white;
    text-decoration:none;
    border-bottom:1px solid #333;
}

.side-menu a:hover{
    background:#222;
}

/* OVERLAY */
.overlay{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.4);
    display:none;
    z-index:999;
}

/* TITLE */
h2{
    margin-top: 25px;
}

/* CHART */
canvas{
    width: 900px !important;
    height: 450px !important;
    margin: 30px auto;
    display: block;
    background: #e0e7ff;
    border-radius: 12px;
    padding: 15px;
}

/* BUTTONS */
button{
    padding: 10px 22px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    background: #2d1457;
    color: white;
    cursor: pointer;
}

button:hover{
    background: #3c1c74;
}

a{ text-decoration: none; }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="left-nav">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="logo">Analysispro</div>
    </div>

    <ul class="menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/login">Login</a></li>
    </ul>
</nav>

<!-- SIDEBAR -->
<div id="sideMenu" class="side-menu">
<a href="/stocks">Stocks</a>
    <a href="/risk">Risk</a>
    <a href="/livechart">Live Chart</a>
    <a href="/prediction">Prediction Chart</a>
    <a href="/technical">Technical Analysis</a>
    <a href="/market">Market</a>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<h2 id="title">Prediction Chart</h2>

<canvas id="pred"></canvas>

<script>

/* SIDEBAR LOGIC */
let menu = document.getElementById("sideMenu");
let overlay = document.getElementById("overlay");

function toggleMenu(){
    if(menu.style.left === "0px"){
        closeMenu();
    }else{
        menu.style.left = "0";
        overlay.style.display = "block";
    }
}

function closeMenu(){
    menu.style.left = "-250px";
    overlay.style.display = "none";
}

/* ===============================
   🔹 STOCK DATA
   =============================== */

const predictionData = {

    },

    },
    "TSLA": {
        actual: [250, 260, 255, 270, 280],
        predicted: [240, 250, 245, 260, 270]
    }
};

const defaultData = {
    actual: [100, 105, 102, 108, 110],
    predicted: [98, 103, 100, 105, 108]
};

let stock = localStorage.getItem("stock") || "TCS";
let data = predictionData[stock] || defaultData;

document.getElementById("title").innerText =
    stock + " Prediction Chart";

/* CHART */
new Chart(document.getElementById("pred"),{
    type:'line',
    data:{
        labels:["Day 1","Day 2","Day 3","Day 4","Day 5"],
        datasets:[
            {
                label:"Actual",
                data:data.actual,
                borderColor:"#22c55e",
                tension:0.4
            },
            {
                label:"Predicted",
                data:data.predicted,
                borderColor:"#ef4444",
                borderDash:[6,6],
                tension:0.4
            }
        ]
    },
    options:{
        responsive:false,
        maintainAspectRatio:false
    }
});

</script>

<a href="/technical"><button>⬅Analysis</button></a>
<a href="/market"><button>Market➡</button></a>

</body>
</html>
